  <!-- Khởi chạy ứng dụng: dùng ES Modules chuẩn trên HTTP/HTTPS và tự động dùng bản fallback nếu mở trực tiếp qua file:// -->
  <script>

        fallbackScript.src = './js/file-fallback.js';
        document.body.appendChild(fallbackScript);
      } else {
        var modScript = document.createElement('script');
